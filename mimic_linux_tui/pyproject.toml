[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic_linux_tui"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "watchdog>=4.0",
]

[project.scripts]
mimic-tui = "mimic_linux_tui.__main__:main"

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["mimic_linux_tui"]
