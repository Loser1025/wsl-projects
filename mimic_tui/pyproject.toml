[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic_tui"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.7",
    "watchdog>=4.0",
]

[project.scripts]
mimic-tui = "mimic_tui.__main__:main"

[tool.setuptools]
package-dir = {"" = ".."}
