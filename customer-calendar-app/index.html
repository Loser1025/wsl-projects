<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Bebas+Neue&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#FFFFFF;color-scheme:light;font-family:'Noto Sans JP','Inter',sans-serif;}
  input,select,button,textarea{font-family:inherit;color-scheme:light;color:inherit;}
</style>
</head>
<body>
<div id="calendar-container"></div>

<!-- React UMD globals loaded via script tags -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Bundled CustomerCalendar component (depends on window.React, window.ReactDOM) -->
<script src="/dist/CustomerCalendar.js"></script>

<script>
  (function () {
    var container = document.getElementById('calendar-container');
    var mounted = false;

    function mount() {
      if (mounted) return true;
      
      // Check if all required globals are available
      if (!window.CustomerCalendar || typeof window.React === 'undefined' || typeof window.ReactDOM === 'undefined') {
        return false;
      }
      
      try {
        var root = window.ReactDOM.createRoot(container);
        root.render(window.React.createElement(window.CustomerCalendar));
        mounted = true;
        return true;
      } catch (e) {
        console.error('CustomerCalendar mount failed:', e);
        return false;
      }
    }

    // Try mounting immediately in case scripts already loaded
    if (mount()) {
      return;
    }

    // Wait for all scripts to load using load event on the last script
    var calendarScript = document.querySelector('script[src="/dist/CustomerCalendar.js"]');
    if (calendarScript && calendarScript.readyState === 'loading') {
      calendarScript.addEventListener('load', mount);
    } else if (calendarScript) {
      // Already loaded, try again
      mount();
    }

    // Fallback: retry on window load
    window.addEventListener('load', function () {
      if (!mounted) mount();
    });

    // Final fallback: timeout-based retry (for slow CDN)
    var deadline = Date.now() + 8000;
    var timer = setInterval(function () {
      if (mount()) {
        clearInterval(timer);
        return;
      }
      if (Date.now() > deadline) {
        clearInterval(timer);
        if (!mounted) {
          console.error('CustomerCalendar mount timeout: React/ReactDOM/CustomerCalendar not available');
          container.innerHTML = '<div style="padding:20px;color:#d32f2f;">カレンダーの読み込みに失敗しました。ページを再読み込みしてください。</div>';
        }
      }
    }, 100);
  })();
</script>
</body>
</html>
