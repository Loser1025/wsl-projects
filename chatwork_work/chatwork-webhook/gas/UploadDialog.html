<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f6f7fb;
      --card-bg: #ffffff;
      --text: #1a1d29;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --success-bg: #ecfdf5;
      --success-text: #047857;
      --success-border: #a7f3d0;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --error-border: #fecaca;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171d;
        --card-bg: #1f2029;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --border: #33343f;
        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --accent-soft: #2a2b52;
        --success-bg: #052e21;
        --success-text: #6ee7b7;
        --success-border: #065f46;
        --error-bg: #3a1414;
        --error-text: #fca5a5;
        --error-border: #7f1d1d;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg { width: 18px; height: 18px; color: var(--accent); }

    h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 12.5px;
      margin: 4px 0 20px 42px;
    }

    .hint-banner {
      margin: 10px 0 20px;
      padding: 10px 12px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.4;
    }

    .field { margin-top: 16px; }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--card-bg)
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%236b7280" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>')
        no-repeat right 12px center;
      background-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus { border-color: var(--accent); }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      position: relative;
      background: var(--bg);
      transition: all 0.2s;
    }
    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .dropzone.has-file {
      border-style: solid;
      border-color: var(--success-border);
      background: var(--success-bg);
    }
    .dropzone input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .dropzone-icon {
      width: 26px; height: 26px; margin: 0 auto 6px;
      color: var(--text-muted);
    }
    .dropzone.has-file .dropzone-icon { color: var(--success-text); }
    .dropzone-text {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }
    .dropzone.has-file .dropzone-text { color: var(--success-text); }
    .dropzone-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .dropzone.has-file .dropzone-hint { color: var(--success-text); opacity: 0.8; }

    .submit {
      margin-top: 22px;
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.2s;
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.2);
    }
    .submit:hover { background: var(--accent-hover); }
    .submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .submit.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .status.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
      display: block;
    }
    .status.success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
      display: block;
      white-space: normal;
    }
    .status.info {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--border);
      display: block;
    }

    .legend {
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .result-sheet-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--success-border);
    }
    .result-sheet-row:last-child { border-bottom: none; }
    .result-sheet-name { font-weight: 700; white-space: nowrap; }
    .result-sheet-stat { text-align: right; }
    .result-sheet-error { color: var(--error-text); }

    .pending-box {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--success-border);
    }
    .pending-box.warn .pending-title { color: var(--error-text); }
    .pending-title { font-weight: 700; margin-bottom: 4px; }
    .pending-list {
      margin: 4px 0 0;
      padding-left: 18px;
    }
    .pending-list li { margin-bottom: 2px; }
    .pending-none { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-8H7v8M7 3v5h8"/><path d="M21 21V7l-5-4H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2z"/></svg>
      </div>
      <h1>CSVデータの統合インポート</h1>
    </div>
    <p class="subtitle">Lステップ友だち詳細CSV ＆ ぽけてる予約一覧CSVを連携</p>
    <p class="hint-banner">📋 ぽけてるCSVも入れてください（完了案件の抽出・提案日/担当者未入力チェックに必要です）</p>

    <div class="field">
      <label for="sheetSelect">対象シート</label>
      <select id="sheetSelect">
        <option value="__ALL__">すべての日付シート</option>
        <? for (var i = 0; i < sheetNames.length; i++) { ?>
          <option value="<?= sheetNames[i] ?>"><?= sheetNames[i] ?></option>
        <? } ?>
      </select>
    </div>

    <div class="field">
      <label>1. Lステップ 友だち詳細CSV（必須）</label>
      <div class="dropzone" id="lstepDropzone">
        <div class="dropzone-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        </div>
        <div class="dropzone-text" id="lstepText">クリックまたはドラッグ&ドロップ</div>
        <div class="dropzone-hint" id="lstepHint">.csv ファイル（Lステップ友だち詳細）</div>
        <input type="file" id="lstepFile" accept=".csv">
      </div>
    </div>

    <div class="field">
      <label>2. ぽけてる予約一覧CSV（完了案件フィルタ用・任意）</label>
      <div class="dropzone" id="poketeruDropzone">
        <div class="dropzone-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        </div>
        <div class="dropzone-text" id="poketeruText">クリックまたはドラッグ&ドロップ</div>
        <div class="dropzone-hint" id="poketeruHint">.csv ファイル（ぽけてる予約一覧）</div>
        <input type="file" id="poketeruFile" accept=".csv">
      </div>
    </div>

    <p class="legend">
      結果の見方：<b>済</b>＝Lステップ情報が揃っている　<b>未：項目名</b>＝その項目が未入力　<b>該当なし</b>＝Lステップに未登録
    </p>

    <button class="submit" id="submitBtn" onclick="submitForm()">
      <span class="spinner"></span>
      <span class="btn-label" id="btnLabel">統合更新を実行</span>
    </button>

    <div class="status" id="status"></div>
  </div>

  <script>
    function setupDropzone(dropzoneId, fileInputId, textId, hintId, defaultHint) {
      var dropzone = document.getElementById(dropzoneId);
      var fileInput = document.getElementById(fileInputId);
      var dropzoneText = document.getElementById(textId);
      var dropzoneHint = document.getElementById(hintId);

      fileInput.addEventListener('change', function() {
        updateDropzoneState(dropzone, fileInput, dropzoneText, dropzoneHint, defaultHint);
      });
      ['dragenter', 'dragover'].forEach(function(evt) {
        dropzone.addEventListener(evt, function(e) {
          e.preventDefault();
          dropzone.classList.add('drag-over');
        });
      });
      ['dragleave', 'drop'].forEach(function(evt) {
        dropzone.addEventListener(evt, function(e) {
          e.preventDefault();
          dropzone.classList.remove('drag-over');
        });
      });
      dropzone.addEventListener('drop', function(e) {
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          updateDropzoneState(dropzone, fileInput, dropzoneText, dropzoneHint, defaultHint);
        }
      });
    }

    function updateDropzoneState(dropzone, fileInput, textEl, hintEl, defaultHint) {
      var file = fileInput.files[0];
      if (file) {
        dropzone.classList.add('has-file');
        textEl.textContent = file.name;
        hintEl.textContent = (file.size / 1024).toFixed(1) + ' KB';
      } else {
        dropzone.classList.remove('has-file');
        textEl.textContent = 'クリックまたはドラッグ&ドロップ';
        hintEl.textContent = defaultHint;
      }
    }

    setupDropzone('lstepDropzone', 'lstepFile', 'lstepText', 'lstepHint', '.csv ファイル（Lステップ友だち詳細）');
    setupDropzone('poketeruDropzone', 'poketeruFile', 'poketeruText', 'poketeruHint', '.csv ファイル（ぽけてる予約一覧）');

    function setStatus(type, text) {
      var el = document.getElementById('status');
      el.className = 'status ' + type;
      el.textContent = text;
    }

    function renderResult(result) {
      var el = document.getElementById('status');
      el.className = 'status success';
      el.textContent = '';

      result.sheets.forEach(function(s) {
        var row = document.createElement('div');
        row.className = 'result-sheet-row';

        var nameEl = document.createElement('span');
        nameEl.className = 'result-sheet-name';
        nameEl.textContent = s.name;
        row.appendChild(nameEl);

        var statEl = document.createElement('span');
        if (s.error) {
          statEl.className = 'result-sheet-stat result-sheet-error';
          statEl.textContent = s.error;
        } else {
          statEl.className = 'result-sheet-stat';
          var text = '一致' + s.matched + '件（完了' + s.complete + '件）／未一致' + s.notFound + '件';
          if (s.poketeruMatched !== null && s.poketeruMatched !== undefined) {
            text += '　ぽけてる完了一致' + s.poketeruMatched + '件';
          }
          statEl.textContent = text;
        }
        row.appendChild(statEl);
        el.appendChild(row);
      });

      if (result.pending) {
        var box = document.createElement('div');
        box.className = 'pending-box' + (result.pending.count > 0 ? ' warn' : '');

        var title = document.createElement('div');
        title.className = 'pending-title';
        title.textContent = 'ぽけてる完了 かつ 提案日・担当者が未入力（' + result.pending.count + '件）';
        box.appendChild(title);

        if (result.pending.count > 0) {
          var ul = document.createElement('ul');
          ul.className = 'pending-list';
          result.pending.names.forEach(function(n) {
            var li = document.createElement('li');
            li.textContent = n;
            ul.appendChild(li);
          });
          box.appendChild(ul);
        } else {
          var none = document.createElement('div');
          none.className = 'pending-none';
          none.textContent = '該当案件はありません';
          box.appendChild(none);
        }
        el.appendChild(box);
      }
    }

    function setLoading(isLoading) {
      var btn = document.getElementById('submitBtn');
      var label = document.getElementById('btnLabel');
      btn.disabled = isLoading;
      btn.classList.toggle('loading', isLoading);
      label.textContent = isLoading ? '処理中…' : '統合更新を実行';
    }

    function submitForm() {
      var lstepFile = document.getElementById('lstepFile').files[0];
      var poketeruFile = document.getElementById('poketeruFile').files[0];
      var sheetSelect = document.getElementById('sheetSelect');

      if (!lstepFile) {
        setStatus('error', 'Lステップ 友だち詳細CSVファイルを選択してください');
        return;
      }

      setLoading(true);
      setStatus('info', 'CSVデータを読み込み中…');

      var readerLStep = new FileReader();
      readerLStep.onload = function(e1) {
        var lstepBase64 = e1.target.result.split(',')[1];

        if (poketeruFile) {
          var readerPoketeru = new FileReader();
          readerPoketeru.onload = function(e2) {
            var poketeruBase64 = e2.target.result.split(',')[1];
            callBackend(lstepBase64, poketeruBase64, sheetSelect.value);
          };
          readerPoketeru.onerror = function() {
            setLoading(false);
            setStatus('error', 'ぽけてるCSVの読み込みに失敗しました');
          };
          readerPoketeru.readAsDataURL(poketeruFile);
        } else {
          callBackend(lstepBase64, null, sheetSelect.value);
        }
      };
      readerLStep.onerror = function() {
        setLoading(false);
        setStatus('error', 'LステップCSVの読み込みに失敗しました');
      };
      readerLStep.readAsDataURL(lstepFile);
    }

    function callBackend(lstepBase64, poketeruBase64, sheetChoice) {
      google.script.run
        .withSuccessHandler(function(result) {
          setLoading(false);
          renderResult(result);
        })
        .withFailureHandler(function(err) {
          setLoading(false);
          setStatus('error', 'エラー: ' + err.message);
        })
        .processDualCsv(lstepBase64, poketeruBase64, sheetChoice);
    }
  </script>
</body>
</html>
