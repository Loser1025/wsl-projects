<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画圧縮と送信テスト</title>
    <script src="/js/compress_and_send.js"></script>
</head>
<body>
    <h1>動画圧縮と送信テスト</h1>
    <input type="file" id="videoInput" accept="video/*" />
    <button id="uploadButton">アップロードと分析</button>
    <div style="margin-top: 20px;">
      <h3>またはGoogle Driveから動画を分析</h3>
      <input type="text" id="driveUrlInput" placeholder="Google DriveのURLを入力" style="width: 100%; padding: 8px;" />
      <button id="driveButton">Google Driveから分析</button>
    </div>
    <div id="result"></div>
    
    <script>
        document.getElementById('uploadButton').addEventListener('click', async () => {
            const fileInput = document.getElementById('videoInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('動画ファイルを選択してください');
                return;
            }
            
            document.getElementById('result').innerHTML = '動画を圧縮中...';
            
            try {
                const result = await compressAndSendToGemini(file);
                
                if (result.error) {
                    document.getElementById('result').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                } else {
                    document.getElementById('result').innerHTML = `
                        <h2>分析結果</h2>
                        <p>総合スコア: ${result.overall_score}</p>
                        <p>表情スコア: ${result.expression.total_score}</p>
                        <p>声トーンスコア: ${result.voice_tone.total_score}</p>
                        <h3>総合評価</h3>
                        <p>${result.summary}</p>
                        <h3>改善点</h3>
                        <ul>
                            ${result.improvements.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `<pre>エラー: ${error.message}</pre>`;
            }
        });
    </script>
</body>
</html>
