<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Phone クリックToコール</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <header class="mb-8 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-slate-700">📞 クリックToコール</h1>
      <a href="/debug" class="text-sm text-blue-500 hover:text-blue-700">🔧 デバッグ</a>
    </header>

    <div id="msg" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>
    <div id="screen-root">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
        <p class="text-slate-400 mb-6">CSVファイルをアップロードしてください</p>
        <form method="POST" action="/upload" enctype="multipart/form-data" class="space-y-4">
          <input type="file" name="csv" accept=".csv,.txt" required class="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
          <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg">アップロード</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let eventSource = null;
    let currentCallPhase = 'idle';
    let currentPhone = null;

    // 画面更新
    function updateScreen(data) {
      if (data.phone) currentPhone = data.phone;
      if (data.call_phase) currentCallPhase = data.call_phase;

      const screenRoot = document.getElementById('screen-root');
      const msgDiv = document.getElementById('msg');
      if (data.msg) {
        msgDiv.textContent = data.msg;
        msgDiv.className = 'mb-4 p-3 rounded-lg text-sm font-medium ' + (data.msg_type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700');
        msgDiv.classList.remove('hidden');
        setTimeout(() => msgDiv.classList.add('hidden'), 5000);
      }

      if (data.system_status === 'stopped' && data.index >= data.total) {
        // 完了画面
        screenRoot.innerHTML = `
          <div class="space-y-5">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
              <div class="flex justify-between text-sm text-slate-500 mb-3">
                <span>進捗</span><span class="font-bold text-slate-700 text-lg" id="progress-text">${data.index} / ${data.total}</span>
              </div>
              <div class="w-full bg-slate-200 rounded-full h-3 mb-5">
                <div class="bg-blue-500 h-3 rounded-full" id="progress-bar" style="width:100%"></div>
              </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center py-6">
              <p class="text-2xl font-bold text-green-600 mb-4">✅ 完了</p>
              <button onclick="doReset()" class="py-3 px-8 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">🔄 もう一度</button>
            </div>
          </div>
        `;
        return;
      }

      // 通常画面
      const progressPercent = Math.round((data.index / data.total) * 100);
      const nextPhoneDisplay = data.phone || '—';
      screenRoot.innerHTML = `
        <div class="space-y-5">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between text-sm text-slate-500 mb-3">
              <span>進捗</span><span class="font-bold text-slate-700 text-lg" id="progress-text">${data.index} / ${data.total}</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-3 mb-5">
              <div class="bg-blue-500 h-3 rounded-full transition-all duration-500" id="progress-bar" style="width:${progressPercent}%"></div>
            </div>
            <div class="bg-blue-50 rounded-xl p-5 text-center">
              <p class="text-xs text-blue-400 mb-2 font-medium">次の番号</p>
              <p class="text-3xl font-bold text-blue-700 tracking-widest" id="next-phone">${escapeHtml(nextPhoneDisplay)}</p>
            </div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-3">
            ${data.zoomphonecall_url && !(data.system_status === 'stopped' && data.index >= data.total) ? `
              <a href="${escapeHtml(data.zoomphonecall_url)}" target="_blank" onclick="handleCallClick(this.href); return false;" class="block w-full py-5 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-bold text-xl rounded-xl text-center shadow-lg shadow-green-100 transition-all">📞 架電する（Zoom起動）</a>
              <div class="grid grid-cols-2 gap-3">
                <button onclick="doSkip()" class="py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-lg transition-all">⏭ スキップ</button>
                <button onclick="doReset()" class="py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg transition-all">🔄 リセット</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // 初期データを取得して反映
    fetch('/api/dashboard-data')
      .then(res => res.json())
      .then(data => updateScreen(data));

    // イベントリスナー
    function handleCallClick(url) {
      if (currentCallPhase === 'calling') {
        alert('現在通話中です。');
        return;
      }
      fetch('/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: currentPhone }) });
      window.open(url, '_blank');
    }

    function doSkip() {
      if (confirm('この番号をスキップしますか？')) {
        fetch('/skip', { method: 'POST' });
      }
    }

    function doReset() {
      if (confirm('インデックスをリセットしますか？')) {
        fetch('/reset', { method: 'POST' });
      }
    }

    // SSE接続
    eventSource = new EventSource('/events');
    eventSource.onmessage = function(event) {
      const data = JSON.parse(event.data);
      updateScreen(data);
    };

    eventSource.onerror = function() {
      setTimeout(() => {
        eventSource.close();
        eventSource = new EventSource('/events');
        eventSource.onmessage = eventSource.onmessage;
        eventSource.onerror = eventSource.onerror;
      }, 5000);
    };

    // HTMLエスケープ関数
    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
  </script>
</body>
</html>
