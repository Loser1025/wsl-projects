<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#FFFFFF;color-scheme:light;}
  input,select,button,textarea{font-family:inherit;color-scheme:light;color:inherit;}
  input::placeholder{color:#c4c4c4;}
  select{appearance:none;-webkit-appearance:none;}
  input[type="color"]{padding:2px 3px;cursor:pointer;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:767px){
    .mc-mast-inner{padding:0 14px !important;}
    .mc-sub-grp,.mc-meta-fade{display:none !important;}
    .mc-wrap{padding:0 14px !important;}
    .mc-kpi{grid-template-columns:repeat(2,1fr) !important;}
    .mc-kpi-c{padding:20px 14px 18px !important;}
    .mc-kpi-c:nth-child(3){border-left:none !important;border-top:1px solid #ececec !important;}
    .mc-kpi-c:nth-child(4){border-top:1px solid #ececec !important;}
    .mc-secs{grid-template-columns:1fr !important;}
    .mc-board-top{flex-direction:column !important;align-items:flex-start !important;gap:10px !important;}
    .mc-divider{display:none !important;}
    .mc-sort{margin-left:0 !important;width:100%;}
    .mc-sort select{width:100% !important;}
    .mc-task-wrap{overflow-x:auto !important;-webkit-overflow-scrolling:touch;}
    .mc-urg-row{flex-wrap:wrap !important;gap:8px !important;}
    button,select{min-height:44px !important;}
    input[type=text]{min-height:40px !important;}
  }
</style>

<body>
<div id="calendar-container"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="/dist/CustomerCalendar.js"></script>
<script>
  (function () {
    var container = document.getElementById('calendar-container');

    function removeOverlay() {
      var overlay = document.getElementById('calendar-overlay');
      if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }

    function mount() {
      if (!window.CustomerCalendar || typeof window.React === 'undefined' || typeof window.ReactDOM === 'undefined') {
        return false;
      }
      try {
        window.ReactDOM.render(window.React.createElement(window.CustomerCalendar), container);
        removeOverlay();
        return true;
      } catch (e) {
        console.error('CustomerCalendar mount failed:', e);
        return false;
      }
    }

    var deadline = Date.now() + 4000;
    var timer = setInterval(function () {
      if (mount()) {
        clearInterval(timer);
        return;
      }
      if (Date.now() > deadline) {
        clearInterval(timer);
        // タイムアウト: オーバーレイを強制削除して永続表示を防ぐ
        removeOverlay();
      }
    }, 50);

    window.addEventListener('load', function () {
      mount();
      setTimeout(removeOverlay, 4200);
    });
  })();
</script>
