<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診断テスト | ANCARI</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1628;--navy2:#1A2E4A;--gold:#C9A84C;--teal:#2ABFA0;--sand:#E8F1FC;--warm:#D0E4F5;--sub:#4A6480;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--sand);color:var(--navy);}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:60px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);border-bottom:1px solid rgba(201,168,76,.2);}
.nav-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:1.1rem;color:var(--navy);}
.nav-logo span{color:var(--gold);}
.nav-prog{display:flex;align-items:center;gap:.8rem;}
.nav-prog-bg{width:120px;height:3px;background:rgba(10,22,40,.1);border-radius:2px;overflow:hidden;}
.nav-prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:2px;transition:width .4s;width:0%;}
.nav-prog-label{font-size:.72rem;font-weight:700;color:rgba(10,22,40,.4);white-space:nowrap;}
.hero{background:var(--navy);padding:100px 5vw 60px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 80%,rgba(201,168,76,.07),transparent 70%);pointer-events:none;}
.hero-inner{max-width:640px;margin:0 auto;position:relative;z-index:1;}
.hero-eye{font-size:.7rem;letter-spacing:.25em;color:var(--teal);margin-bottom:1.2rem;font-weight:700;}
.hero-h1{font-family:'Zen Kaku Gothic New',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;color:#fff;line-height:1.3;margin-bottom:.8rem;}
.hero-h1 em{font-family:'Playfair Display',serif;font-style:italic;color:var(--teal);}
.hero-lead{font-size:.88rem;color:rgba(255,255,255,.5);line-height:1.9;margin-bottom:1.6rem;}
.hero-meta{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;}
.hero-meta span{font-size:.72rem;color:rgba(255,255,255,.35);display:flex;align-items:center;gap:.3rem;}
.hero-meta span::before{content:'✓';color:var(--teal);}
.hero-divider{height:40px;background:linear-gradient(180deg,var(--navy),var(--sand));}
.quiz{max-width:640px;margin:0 auto;padding:12px 5vw 100px;}
.prog-sticky{position:sticky;top:60px;z-index:50;background:var(--sand);padding:.5rem 0 .4rem;margin-bottom:.8rem;}
.prog-bar{display:flex;align-items:center;gap:.8rem;}
.prog-bg{flex:1;height:4px;background:var(--warm);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:2px;transition:width .4s;width:0%;}
.prog-label{font-size:.72rem;font-weight:700;color:var(--sub);white-space:nowrap;}
.sec-label{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;background:var(--navy);border-radius:8px;margin:1.6rem 0 .8rem;}
.sec-num{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--gold);}
.sec-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.85rem;font-weight:700;color:#fff;}
.sec-sub{font-size:.7rem;color:rgba(255,255,255,.4);margin-top:.1rem;}
.q-card{background:#fff;border-radius:12px;padding:1.6rem 1.8rem;margin-bottom:.7rem;box-shadow:0 2px 16px rgba(13,27,46,.06);transition:opacity .3s;}
.q-card.done{opacity:.55;}
.q-num{font-size:.68rem;font-weight:700;color:var(--gold);letter-spacing:.1em;margin-bottom:.5rem;}
.q-text{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;line-height:1.55;margin-bottom:1rem;}
.opts{display:flex;flex-direction:column;gap:.45rem;}
.opt{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;border:1.5px solid var(--warm);border-radius:8px;cursor:pointer;font-size:.86rem;transition:border-color .15s,background .15s;user-select:none;}
.opt:hover{border-color:var(--gold);background:rgba(201,168,76,.04);}
.opt.sel{border-color:var(--gold);background:rgba(201,168,76,.08);}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--warm);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.opt.sel .dot{border-color:var(--gold);background:var(--gold);}
.opt.sel .dot::after{content:'';width:5px;height:5px;border-radius:50%;background:white;}
.scale-wrap{display:flex;flex-direction:column;gap:.5rem;}
.scale-labels{display:flex;justify-content:space-between;font-size:.65rem;color:var(--sub);}
.scale-btns{display:flex;gap:.35rem;}
.scale-btn{flex:1;padding:.65rem .2rem;border:1.5px solid var(--warm);border-radius:8px;background:#fff;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;font-weight:700;color:var(--sub);transition:all .15s;text-align:center;}
.scale-btn:hover{border-color:var(--gold);color:var(--gold);}
.scale-btn.sel{border-color:var(--gold);background:var(--gold);color:white;}
.result{border-radius:16px;overflow:hidden;margin-top:1rem;box-shadow:0 8px 40px rgba(13,27,46,.12);opacity:0;transform:translateY(16px);transition:opacity .4s,transform .4s;}
.result.show{opacity:1;transform:none;}
.res-head{padding:2rem 1.8rem 1.6rem;text-align:center;}
.res-eye{font-size:.65rem;letter-spacing:.22em;color:rgba(255,255,255,.5);margin-bottom:.6rem;display:inline-block;border:1px solid rgba(255,255,255,.2);padding:.2rem .7rem;border-radius:20px;}
.res-char{display:flex;justify-content:center;margin-bottom:.6rem;}
.res-name{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1.8rem;font-weight:900;color:white;margin-bottom:.3rem;}
.res-catch{font-size:.85rem;color:rgba(255,255,255,.6);font-style:italic;}
.res-body{background:white;padding:1.6rem 1.8rem;}
.res-sec{font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--sub);padding-bottom:.4rem;border-bottom:1px solid var(--warm);margin-bottom:.8rem;text-transform:uppercase;}
.neg-box{background:linear-gradient(135deg,rgba(10,22,40,.04),rgba(201,168,76,.07));border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:1.1rem 1.3rem;margin-bottom:1.4rem;}
.neg-label{font-size:.65rem;letter-spacing:.15em;color:var(--gold);font-weight:700;margin-bottom:.5rem;}
.neg-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:700;color:var(--navy);line-height:1.6;margin-bottom:.4rem;}
.neg-sub{font-size:.8rem;color:var(--sub);line-height:1.8;}
.type-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.8rem;}.type-list>*{}
.tl-item{border-radius:8px;padding:.7rem .5rem;text-align:center;}
.tl-num{font-size:.58rem;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-bottom:.25rem;}
.tl-name{font-size:.7rem;font-weight:700;color:white;line-height:1.3;}.tl-item svg{width:55px;height:66px;display:block;margin:0 auto .2rem;}.tl-catch{font-size:.62rem;color:rgba(255,255,255,.6);margin-top:.2rem;line-height:1.4;}.tl-item{cursor:pointer;transition:transform .15s;}.tl-item:hover{transform:scale(1.03);}
.type-note{font-size:.75rem;color:var(--sub);line-height:1.7;margin-bottom:1.4rem;}
.teaser-wrap{position:relative;margin-bottom:1.4rem;}
.teaser-blur{filter:blur(2px);user-select:none;pointer-events:none;}
.str-box{background:rgba(42,191,160,.05);border:1px solid rgba(42,191,160,.2);border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem;}
.str-label{font-size:.65rem;letter-spacing:.15em;color:var(--teal);font-weight:700;margin-bottom:.5rem;}
.str-item{font-size:.84rem;display:flex;align-items:flex-start;gap:.4rem;line-height:1.65;margin-bottom:.3rem;}
.str-item::before{content:'✦';color:var(--teal);font-size:.65rem;margin-top:.2rem;flex-shrink:0;}
.bar-row{margin-bottom:.8rem;}
.bar-top{display:flex;justify-content:space-between;font-size:.75rem;color:var(--sub);margin-bottom:.3rem;}
.bar-bg{height:5px;background:var(--warm);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.teaser-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,transparent 50%,rgba(255,255,255,.85) 70%,rgba(255,255,255,1) 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:1.2rem;}
.teaser-lock{font-size:1.8rem;margin-bottom:.4rem;}
.teaser-msg{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:.2rem;text-align:center;}
.teaser-sub{font-size:.75rem;color:var(--sub);text-align:center;}
.line-cta{padding:1.8rem;text-align:center;}
.line-eye{font-size:.65rem;letter-spacing:.18em;color:rgba(255,255,255,.35);margin-bottom:.4rem;}
.line-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1.15rem;font-weight:900;color:white;line-height:1.5;margin-bottom:.4rem;}
.line-sub{font-size:.8rem;color:rgba(255,255,255,.45);line-height:1.8;margin-bottom:1.1rem;}
.line-pts{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.2rem;text-align:left;max-width:280px;margin-left:auto;margin-right:auto;}
.line-pt{font-size:.8rem;color:rgba(255,255,255,.65);display:flex;gap:.4rem;}
.line-pt::before{content:'✓';color:var(--teal);flex-shrink:0;}
.btn-line{display:inline-flex;align-items:center;justify-content:center;width:100%;max-width:320px;padding:1rem 1.4rem;background:#06C755;color:white;border:none;border-radius:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:900;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 4px 20px rgba(6,199,85,.3);}
.btn-line:hover{background:#05a849;transform:translateY(-2px);}
.line-note{font-size:.65rem;color:rgba(255,255,255,.25);margin-top:.7rem;}
@media(max-width:560px){.q-card{padding:1.2rem 1rem;}.scale-btn{font-size:.8rem;}nav{padding:0 4vw;}.nav-prog{display:none;}.res-name{font-size:1.5rem;}.type-list{grid-template-columns:repeat(2,1fr);}}

.form-box{background:#f8f9ff;border:1px solid rgba(201,168,76,.25);border-radius:12px;padding:1.4rem 1.6rem;margin-bottom:1.2rem;}
.form-box-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.3rem;}
.form-box-sub{font-size:.78rem;color:var(--sub);margin-bottom:1rem;line-height:1.6;}
.form-field{margin-bottom:.8rem;}
.form-label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--sub);margin-bottom:.3rem;}
.form-input{width:100%;padding:.75rem .9rem;border:1.5px solid var(--warm);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.88rem;color:var(--navy);background:#fff;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--gold);}
.btn-submit{width:100%;padding:.95rem;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:900;cursor:pointer;transition:all .2s;margin-bottom:.6rem;}
.btn-submit:hover{background:#1A2E4A;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.form-done{text-align:center;padding:1rem 0;}
.form-done-icon{font-size:2rem;margin-bottom:.5rem;}
.form-done-text{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.3rem;}
.form-done-sub{font-size:.78rem;color:var(--sub);line-height:1.7;}

.form-box{background:#f8f9ff;border:1px solid rgba(201,168,76,.25);border-radius:12px;padding:1.4rem 1.6rem;margin-bottom:1.2rem;}
.form-box-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.3rem;}
.form-box-sub{font-size:.78rem;color:var(--sub);margin-bottom:1rem;line-height:1.6;}
.form-field{margin-bottom:.8rem;}
.form-label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--sub);margin-bottom:.3rem;}
.form-input{width:100%;padding:.75rem .9rem;border:1.5px solid var(--warm);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.88rem;color:var(--navy);background:#fff;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--gold);}
.btn-submit{width:100%;padding:.95rem;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:900;cursor:pointer;transition:all .2s;margin-bottom:.6rem;}
.btn-submit:hover{background:#1A2E4A;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.form-done{text-align:center;padding:1rem 0;}
.form-done-icon{font-size:2rem;margin-bottom:.5rem;}
.form-done-text{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.3rem;}
.form-done-sub{font-size:.78rem;color:var(--sub);line-height:1.7;}
</style>
</head>

var TOTAL=QS.length,answers=new Array(TOTAL).fill(null),quiz=document.getElementById('quiz');
function calcType(){
  var a=answers;
  // 各タイプのスコアを加算して一番高いものを返す
  var scores={DEEP:0,EMPATH:0,QUALITY:0,EXPLORER:0,HARMONY:0,SEEKER:0};

  // Q1-Q6 認知スタイル
  if(a[0]===0) scores.DEEP+=2;      // 話しながら考える
  if(a[0]===1) scores.SEEKER+=1;    // まとめてから話す
  if(a[1]===0) scores.EXPLORER+=2;  // 話が広がる
  if(a[1]===1) scores.QUALITY+=2;   // 要点を絞る
  if(a[2]===0) scores.DEEP+=1;      // あとから気づく
  if(a[2]===1) scores.EMPATH+=2;    // リアルタイムに感じる
  if(a[3]===0) scores.EMPATH+=2;    // 引いてしまう
  if(a[3]===0) scores.HARMONY+=1;
  if(a[3]===1) scores.SEEKER+=1;    // 伝えられる
  if(a[4]===0) scores.DEEP+=2;      // 分析してから
  if(a[4]===1) scores.EXPLORER+=1;  // とりあえず動く
  if(a[5]===0) scores.DEEP+=1;      // 言語化に時間
  if(a[5]===1) scores.EMPATH+=1;    // すぐ言葉に

  // Q7-Q12 ブレーキ診断（5段階）
  var bp=a[6]||0,br=a[7]||0,bpe=a[8]||0,bs=a[9]||0,bw=a[10]||0,bc=a[11]||0;
  scores.DEEP    += bp * 0.8;   // 準備不足感
  scores.EMPATH  += br * 0.8;   // 迷惑かも
  scores.QUALITY += bpe * 0.8;  // 完璧主義
  scores.EMPATH  += bs * 0.6;   // 相手優先
  scores.HARMONY += bs * 0.4;
  scores.SEEKER  += bw * 0.8;   // まだ足りない
  scores.QUALITY += bw * 0.4;
  scores.HARMONY += bc * 0.8;   // 比べられるのを避ける

  // Q13 現在地
  if(a[12]===0) scores.DEEP+=2;      // 同じところを回っている
  if(a[12]===1) scores.EXPLORER+=2;  // 決めきれない
  if(a[12]===2) scores.EMPATH+=2;    // 左右されやすい
  if(a[12]===3) scores.SEEKER+=2;    // 言語化できない

  // Q14 悩み
  if(a[13]===0) scores.DEEP+=1;      // 決断が遅れる
  if(a[13]===0) scores.EXPLORER+=1;
  if(a[13]===1) scores.QUALITY+=2;   // 自信が揺れる
  if(a[13]===2) scores.SEEKER+=2;    // 行動が続かない
  if(a[13]===3) scores.HARMONY+=2;   // 本音出しにくい
  if(a[13]===3) scores.EMPATH+=1;

  // Q15 オープン度（スコアに影響なし）

  // 最高スコアのタイプを返す
  var best='DEEP',maxScore=0,k;
  for(k in scores){
    if(scores[k]>maxScore){maxScore=scores[k];best=k;}
  }
  return best;
}
function updateProg(){
  var n=answers.filter(function(x){return x!==null;}).length,p=(n/TOTAL*100).toFixed(1);
  document.getElementById('progFill').style.width=p+'%';
  document.getElementById('progLabel').textContent=n+' / '+TOTAL+' 回答済み';
  document.getElementById('navFill').style.width=p+'%';
  document.getElementById('navLabel').textContent=n+' / '+TOTAL;
}
function addSec(i){
  var s;
  for(s=0;s<SECS.length;s++){
    if(SECS[s].r0===i){
      var el=document.createElement('div');
      el.className='sec-label';
      el.innerHTML='<div class="sec-num">'+SECS[s].num+'</div><div><div class="sec-title">'+SECS[s].title+'</div><div class="sec-sub">'+SECS[s].sub+'</div></div>';
      quiz.appendChild(el);
    }
  }
}
function renderQ(i){
  addSec(i);
  var q=QS[i],card=document.createElement('div');
  card.className='q-card';card.id='q'+i;
  var h='<div class="q-num">Q'+(i+1)+'</div><div class="q-text">'+q.q+'</div>';
  if(q.t==='ab'){
    h+='<div class="opts" id="opts'+i+'">';
    var j;
    for(j=0;j<q.o.length;j++){h+='<div class="opt" onclick="pick('+i+','+j+')"><div class="dot"></div><span>'+q.o[j]+'</span></div>';}
    h+='</div>';
  }else{
    h+='<div class="scale-wrap"><div class="scale-labels"><span>全く当てはまらない</span><span>とても当てはまる</span></div><div class="scale-btns" id="opts'+i+'">';
    var v;
    for(v=1;v<=5;v++){h+='<button class="scale-btn" onclick="sc('+i+','+v+')">'+v+'</button>';}
    h+='</div></div>';
  }
  card.innerHTML=h;quiz.appendChild(card);
}

window.submitForm=function(tk,tn){
  var name=document.getElementById('inputName').value.trim();
  var email=document.getElementById('inputEmail').value.trim();
  if(!name){alert('お名前を入力してください');return;}
  if(!email||email.indexOf('@')<0){alert('メールアドレスを入力してください');return;}
  var btn=document.getElementById('submitBtn');
  btn.textContent='送信中...';btn.disabled=true;
  track({type:'form_submit',typeKey:tk,typeName:tn,name:name,email:email});
  setTimeout(function(){
    document.getElementById('formWrap').style.display='none';
    document.getElementById('formDone').style.display='block';
  },800);
};
window.toggleType=function(key){
  var desc=document.getElementById('tldesc-'+key);
  if(!desc)return;
  desc.style.display=(desc.style.display==='none')?'block':'none';
};
window.pick=function(i,j){
  var isNew=answers[i]===null;answers[i]=j;
  var opts=document.querySelectorAll('#opts'+i+' .opt'),k;
  for(k=0;k<opts.length;k++){opts[k].classList.toggle('sel',k===j);}
  after(i,isNew);
};
window.sc=function(i,v){
  var isNew=answers[i]===null;answers[i]=v;
  var btns=document.querySelectorAll('#opts'+i+' .scale-btn'),k;
  for(k=0;k<btns.length;k++){btns[k].classList.toggle('sel',k+1===v);}
  after(i,isNew);
};
function after(i,isNew){
  updateProg();
  var card=document.getElementById('q'+i);
  if(card)card.classList.add('done');
  var ex=document.getElementById('result');
  if(ex){ex.remove();setTimeout(showResult,50);return;}
  if(!isNew)return;
  setTimeout(function(){
    var next=i+1;
    if(next<TOTAL){var el=document.getElementById('q'+next);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
    else showResult();
  },200);
}
function showResult(){
  // 全問回答チェック
  var unanswered=answers.filter(function(x){return x===null;}).length;

      // 3. 6タイプ一覧（キャラ付き）
      '<div class="res-sec">6つの認知タイプ</div>'+
      '<div class="type-list">'+tlHtml+'</div>'+
      '<p class="type-note">あなたは<strong>'+t.name+'</strong>タイプ。各タイプには固有の強みとブロックがある。</p>'+
    '</div>'+
    '<input type="hidden" id="resultTypeKey">'+
    '<input type="hidden" id="resultTypeName">'+
    '<div class="form-box">'+
      '<div class="form-box-title">詳細レポートを受け取る</div>'+
      '<div class="form-box-sub">お名前とメールアドレスを入力してください。あなたのタイプに合わせた詳細レポートをお届けします。</div>'+
      '<div id="formWrap">'+
        '<div class="form-field"><label class="form-label">お名前（ニックネームでもOK）</label>'+

        '<input class="form-input" type="email" id="inputEmail" placeholder="example@email.com"></div>'+

        '<div style="font-size:.68rem;color:var(--sub);text-align:center">スパムメールは送りません。いつでも解除できます。</div>'+
      '</div>'+
      '<div id="formDone" style="display:none" class="form-done">'+
        '<div class="form-done-icon">&#9989;</div>'+
        '<div class="form-done-text">ありがとうございます！</div>'+
        '<div class="form-done-sub">まもなく詳細レポートをお届けします。続けてLINEを登録してください。</div>'+
      '</div>'+
    '</div>'+
    '<div class="line-cta" style="background:'+t.lineBg+'">'+
      '<div class="line-eye">NEXT STEP</div>'+
      '<div class="line-title">もっと知りたいですか？<br>LINEで全部お届けします。</div>'+
      '<div class="line-sub">LINEを登録すると、認知タイプの詳細レポートと無料30分の結果面談にご招待します。</div>'+
      '<div class="line-pts">'+
        '<div class="line-pt">強み・ブロックの詳細分析レポート</div>'+
        '<div class="line-pt">無料30分の結果面談にご招待</div>'+
        '<div class="line-pt">あなたに合ったアプローチを提案</div>'+
      '</div>'+
      '<a href="'+LINE_URL+'" target="_blank" rel="noopener" class="btn-line" onclick="track({type:\'line_click\',typeKey:key})">LINEで詳細レポートを受け取る</a>'+
      '<div class="line-note">無料 ・ いつでも友だち解除OK</div>'+
    '</div>';
  quiz.appendChild(el);
  var tkEl=document.getElementById('resultTypeKey');if(tkEl)tkEl.value=key;
  var tnEl=document.getElementById('resultTypeName');if(tnEl)tnEl.value=t.name;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      el.classList.add('show');
      setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'});},80);
    });
  });
}
var i;
for(i=0;i<TOTAL;i++){renderQ(i);}
updateProg();
})();
